; Unisexy.ini - Configuration for Unisexy SKSE mod
; This mod creates gender-flipped versions of head parts (hair, eyes, scars, eyebrows, facial hair).
; Set each option to true/false to enable/disable creating gender-flipped versions.
;
; Changes take effect on the next game start. Delete this file to restore the defaults.
; New parts are named <OriginalEditorID>_Unisexy and appear in the RaceMenu lists
; next to the originals.

[HeadPartTypes]

; Enable converting female parts to male versions
; (a female-only hair becomes selectable on male characters)
HairMale=true
ScarsMale=true
EyesMale=true
BrowsMale=true
FacialHairMale=true

; Enable converting male parts to female versions
; (a male-only beard or hair becomes selectable on female characters)
HairFemale=true
ScarsFemale=true
EyesFemale=true
BrowsFemale=true
FacialHairFemale=true

[Debug]

; Enable detailed logging for debugging
; Writes every created part to Unisexy.log - slows startup, leave off unless troubleshooting
VerboseLogging=false

; Master switch: hide the original head parts and show only the Unisexy versions.
; Applies to ALL categories and overrides everything in the [ShowOnlyUnisexy] section below.
; An original is only hidden after its Unisexy copy was created successfully, so categories
; turned off in [HeadPartTypes] are left alone and nothing can go missing.
ShowOnlyUnisexy=false

[ShowOnlyUnisexy]

; Hide the original head parts one category at a time.
; Ignored when Debug/ShowOnlyUnisexy above is set to true.
;
; These only work where the matching conversion in [HeadPartTypes] is enabled:
;   a female-only part is hidden only when <Category>Male = true
;   a male-only part is hidden only when <Category>Female = true
; So set BOTH directions to true to hide a category's originals completely.
; With the conversion off, the setting below does nothing at all.
ShowOnlyUnisexyHair=false
ShowOnlyUnisexyEyes=true
ShowOnlyUnisexyScars=true
ShowOnlyUnisexyBrows=true
ShowOnlyUnisexyFacialHair=true
