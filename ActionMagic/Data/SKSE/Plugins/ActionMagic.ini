[General]
; Master switch for the plugin.
bEnabled = true

; Show a top-left notification with the newly selected spell.
bShowNotifications = true

[Controls]
; Key codes use the SKSE / SkyUI numbering:
;   keyboard 0-255 (DirectInput scan codes, e.g. 42 = Left Shift, 29 = Left Ctrl, 56 = Left Alt)
;   mouse    256-265 (264 = wheel up, 265 = wheel down)
;   gamepad  266-281 (266 = D-pad up, 267 = D-pad down, 268 = D-pad left, 269 = D-pad right,
;                     274 = LB, 275 = RB, 276 = A, 277 = B, 278 = X, 279 = Y)

; Key that must be held while cycling. 0 = no modifier. Default 42 = Left Shift.
iModifierKey = 42

; Next spell. Default 265 = mouse wheel down.
iNextKey = 265

; Previous spell. Default 264 = mouse wheel up.
iPrevKey = 264

[BareHand]
; Preferred hand when no staff is equipped: Right or Left.
; If that hand holds a weapon, shield or torch, the other hand is used instead.
sTargetHand = Right
