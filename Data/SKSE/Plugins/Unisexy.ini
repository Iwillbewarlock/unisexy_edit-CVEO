; Unisexy.ini - Configuration for Unisexy SKSE mod
; This mod creates gender-flipped versions of head parts (hair, eyes, scars, eyebrows, facial hair).
; Set each option to true/false to enable/disable creating gender-flipped versions.

[HeadPartTypes]
; Enable converting female parts to male versions
HairMale=true
ScarsMale=false
EyesMale=true
BrowsMale=false
FacialHairMale=false

; Enable converting male parts to female versions
HairFemale=true
ScarsFemale=false
EyesFemale=true
BrowsFemale=false
FacialHairFemale=false

[Debug]
; Enable detailed logging for debugging
VerboseLogging=false

; Hide vanilla head parts, showing only Unisexy-created versions (applies to all categories)
ShowOnlyUnisexy=false

[ShowOnlyUnisexy]
; Hide original head parts per category (ignored when Debug/ShowOnlyUnisexy=true)
ShowOnlyUnisexyHair=false
ShowOnlyUnisexyEyes=false
ShowOnlyUnisexyScars=false
ShowOnlyUnisexyBrows=false
ShowOnlyUnisexyFacialHair=false
